# Nixpacks config pour Coolify
[phases.setup]
npmInstall = true

[phases.install]
cmds = [
  'npm install -g bun',
  'bun install --frozen-lockfile',
]

[phases.build]
cmds = [
  'npx prisma generate',
  'npx prisma db push --accept-data-loss',
  'bun run build',
]

[phases.start]
cmd = 'node server.js'

[variables]
NODE_ENV = 'production'
PORT = '3000'
NIXPACKS_PKGS = 'openssl sqlite'
